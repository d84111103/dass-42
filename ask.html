<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>常見問答 | 年齡與憂鬱、焦慮、壓力的關係</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        🧠 心理學專題：DASS-42 研究
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">首頁</a></li>
        <li><a href="results.html" class="nav-link">研究結果</a></li>
        <li><a href="ask.html" class="nav-link active">常見問答</a></li>
        <li><a href="about.html" class="nav-link">關於研究</a></li>
      </ul>
    </div>
  </header>

  <main>
    <div class="page-header">
      <h1>💬 常見問答與對話諮詢</h1>
      <p>提供 DASS-42 量表相關衛教知識、專題常見疑問解答與智慧問答模組。</p>
    </div>

    <!-- Coming Soon Card -->
    <div class="coming-soon-box">
      <div class="coming-soon-icon">🚀</div>
      <h2>即將推出 (Coming Soon)</h2>
      <p>我們正在開發結合 DASS-42 量表數據與心理學衛教知識庫的智慧 Q&A 問答功能，未來將為您提供線上疑問解答與心理健康衛教資訊。敬請期待！</p>
      
      <div style="margin-top: 1.5rem;">
        <button id="testBtn" class="btn-toggle active" onclick="testConnection()">🔗 測試連線</button>
        <div id="testResult" style="margin-top: 1rem; font-size: 0.95rem; font-weight: 600; word-break: break-all;"></div>
      </div>
    </div>
  </main>

  <footer>
    <p>心理學系研究專題小組 | DASS-42 心理健康資料分析</p>
    <p>組員：_（專題組別：第 _ 組）</p>
  </footer>

  <script>
    async function testConnection() {
      const resultDiv = document.getElementById('testResult');
      const btn = document.getElementById('testBtn');

      resultDiv.style.color = 'var(--text-muted)';
      resultDiv.textContent = '連線測試中...';
      btn.disabled = true;

      try {
        const response = await fetch('https://dass-42.d84111103.workers.dev/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ action: 'test' })
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.style.color = '#10b981';
          resultDiv.textContent = `連線成功！回應內容：${JSON.stringify(data)}`;
        } else {
          resultDiv.style.color = '#ef4444';
          resultDiv.textContent = `連線失敗 (HTTP ${response.status})：${data.error || JSON.stringify(data)}`;
        }
      } catch (error) {
        resultDiv.style.color = '#ef4444';
        resultDiv.textContent = `連線發生錯誤：${error.message}`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
